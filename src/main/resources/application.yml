server:
  port: ${PORT:8080}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: omniqa-studio

  datasource:
    url: ${DB_URL:jdbc:postgresql://db.nkqyjbtqzevqwkoltbd.supabase.co:5432/postgres}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:your-email@gmail.com}
    password: ${MAIL_PASSWORD:your-gmail-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  # Redis (prod). Set SPRING_DATA_REDIS_HOST to activate RedisCacheConfig.
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

# Security and JWT Configuration
jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days

# Google Cloud Storage Configuration
gcp:
  storage:
    bucket-name: ${GCS_BUCKET_NAME:omniqa-studio-assets}
    project-id: ${GCS_PROJECT_ID:omniqa-studio}
    credentials-path: ${GCS_CREDENTIALS_PATH:}

# AI / LLM Configuration (merged: OpenAI-compatible first, local Ollama fallback)
ai:
  llm:
    api-key: ${AI_API_KEY:}
    api-url: ${AI_API_URL:https://api.openai.com/v1/chat/completions}
    model: ${AI_MODEL:gpt-4o-mini}

# Local LLM fallback (merged from Autonomous)
ollama:
  base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
  model: ${OLLAMA_MODEL:llama3.2}

# CORS + async hardening (override via env in prod)
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  cache:
    # Set REDIS_ENABLED=true + SPRING_DATA_REDIS_HOST when Redis is available (docker-compose / prod).
    redis-enabled: ${REDIS_ENABLED:false}

# Service-to-service key for automation engine ingest (empty = open in dev)
service:
  api-key: ${SERVICE_API_KEY:}

